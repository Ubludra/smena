# Smena web — static SPA server (nginx-unprivileged: listens on 8080, no root).
# NOTE: nginx `add_header` inside a location REPLACES server-level headers,
# so the security set is repeated where location-level headers are added.
# Security headers are defense-in-depth only; enforcement lives in the API.
#
# CSP `script-src` includes https://st.max.ru because the official MAX Bridge
# library is loaded from that CDN (dev.max.ru/docs/webapps/bridge). It is the
# only third-party script the app executes.
#
# Same-origin API: /api/... and /health/... are proxied to the FastAPI
# container, so the SPA talks to the API through relative URLs only
# (`VITE_API_BASE_URL` is empty in production builds). No cross-origin
# requests from the public MAX entrypoint; CORS stays for dev origins.
#
# Framing: the MAX *web* client (web.max.ru) embeds mini apps in an <iframe>
# (confirmed by request referer 2026-10-30), so X-Frame-Options: DENY caused
# a white screen there. Replaced with a CSP frame-ancestors allowlist of MAX
# origins only — every other site still cannot frame us (clickjacking-safe).
# MAX mobile/desktop use a native webview and never send framing headers.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (server level: inherited by locations below) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # localtunnel (temporary HTTPS test tunnels) injects a phishing-warning
    # interstitial unless the origin sends this header. Harmless elsewhere.
    add_header Bypass-Tunnel-Reminder "true" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://st.max.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self' https://web.max.ru https://max.ru; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets: safe to cache long-term.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The document itself must never be cached or restored stale, so a
    # refresh always revalidates which build the user is looking at.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Bypass-Tunnel-Reminder "true" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://st.max.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self' https://web.max.ru https://max.ru; base-uri 'self'; form-action 'self'" always;
    }

    # --- Same-origin API proxy (MAX Mini App entrypoint) -----------------
    # The SPA calls relative /api/v1/... and /health/... URLs; nginx forwards
    # them to the FastAPI container on the compose network. One public HTTPS
    # origin serves React + API + downloads — no localhost/cross-origin URLs
    # inside the MAX webview (would be mixed content or unreachable).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;  # matches UPLOAD_MAX_BYTES (20 MiB) + margin
    }

    location /health/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
