[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smena-api"
version = "0.1.0"
description = "Smena — teacher workspace inside MAX (mini app backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29,<0.31",
    "alembic>=1.13,<2.0",
    "python-multipart>=0.0.9,<1.0",
    # UUIDv7 (RFC 9562) time-ordered identifiers — see docs/adr/0001.
    "uuid-utils>=0.9,<1.0",
    # Signed access tokens (HS256, pinned algorithm) — see core/tokens.py.
    "pyjwt>=2.9,<3.0",
    "webauthn>=2.2,<3.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.5",
    "mypy>=1.10,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smena_api = ["py.typed"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific
]
ignore = [
    # Ambiguous-unicode rules: this is a Russian-language product; Cyrillic
    # in strings/comments/test data is intentional, not confusable typos.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # asserts and fixture "secrets" are fine
"alembic/env.py" = ["B008"]
# Depends() in argument defaults is FastAPI's documented dependency-injection
# idiom; flagging it would only encourage worse patterns.
"src/smena_api/api/*" = ["B008"]
# Domain error class names are intentionally short (MaxNotConfigured reads
# better in `except` clauses than an Error-suffixed variant).
"src/smena_api/integrations/*" = ["N818"]

# ---------------------------------------------------------------------------
# Mypy (strict)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["smena_api"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
